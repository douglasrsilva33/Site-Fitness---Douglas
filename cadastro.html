
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova matrícula | Fitness Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="logo" href="index.html">FITNESS MANAGER</a>
        <nav>
            <a href="index.html">Painel</a>
            <a href="cadastro.html">Matrículas</a>
            <a href="planos.html">Planos</a>
        </nav>
    </header>

    <main class="container">
        <h1>Nova matrícula</h1>
        <p class="subtitle">Preencha os dados do aluno.</p>

        <form action="processar.php" method="POST" id="formMatricula">
            <div class="form-grid">
                <div class="field">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome"
                           minlength="3" maxlength="120"
                           autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="nascimento">Data de nascimento</label>
                    <input type="date" id="nascimento" name="nascimento"
                           required>
                </div>

                <div class="field">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone"
                           placeholder="(41) 99999-9999"
                           autocomplete="tel" required>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email"
                           autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="data">Data da matrícula</label>
                    <input type="date" id="data" name="data"
                           required>
                </div>

                <div class="field">
                    <label for="plano">Plano</label>
                    <select id="plano" name="plano" required>
                        <option value="">Selecione um plano</option>
                        <option value="Basico">Básico - R$ 89,90</option>
                        <option value="Plus">Plus - R$ 129,90</option>
                        <option value="Premium">Premium - R$ 179,90</option>
                    </select>
                </div>

                <div class="field">
                    <label for="pagamento">Forma de pagamento</label>
                    <select id="pagamento" name="pagamento" required>
                        <option value="">Selecione</option>
                        <option value="PIX">PIX</option>
                        <option value="Cartao">Cartão</option>
                    </select>
                </div>
            </div>

            <div id="previa" class="preview" aria-live="polite">
                Selecione um plano e uma forma de pagamento para
                consultar o valor estimado.
            </div>

            <button class="btn" type="submit">Confirmar matrícula</button>
        </form>
    </main>
</body>
</html>
